kind = "web"
  previewPath = "/"
  title = "Napa Paws & Vines"
  version = "1.0.0"
  id = "artifacts/napa-directory"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  localPort = 18252
  name = "web"
  paths = ["/"]

  [services.development]
  run = "pnpm --filter @workspace/napa-directory run dev"

  [services.env]
  PORT = "18252"
  BASE_PATH = "/"

  [services.production]
  build = "pnpm --filter @workspace/napa-directory run build && pnpm --filter @workspace/api-server run build"
  run = ["node", "artifacts/api-server/dist/index.cjs"]

  [services.production.health.startup]
  path = "/api/healthz"
  